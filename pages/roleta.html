<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta da Sorte - Autoriza o Árbitro! | Garena Free Fire</title>
    <link rel="icon" type="image/png" href="../images/iconff.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root{--c-primary:#FF6B00;--c-accent:#FFD700;--c-bg:#0D0602;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{background:var(--c-bg)!important;font-family:'Poppins',sans-serif;color:#fff;min-height:100vh;}
    a{color:inherit;text-decoration:none;}img{max-width:100%;display:block;}button{cursor:pointer;font-family:inherit;}

    .ambient-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
    .ambient-bg::before,.ambient-bg::after{content:'';position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(90px);opacity:.3;will-change:transform;}
    .ambient-bg::before{background:radial-gradient(circle,var(--c-primary),transparent 60%);top:-14vmax;left:-10vmax;animation:orbA 20s ease-in-out infinite;}
    .ambient-bg::after{background:radial-gradient(circle,var(--c-accent),transparent 60%);bottom:-16vmax;right:-12vmax;animation:orbB 24s ease-in-out infinite;}
    @keyframes orbA{0%,100%{transform:translate(0,0)}50%{transform:translate(5vmax,4vmax)}}
    @keyframes orbB{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vmax,-3vmax)}}

    .page-content{position:relative;z-index:1;}
    .ff-container{max-width:32rem;margin:0 auto;padding:0 16px;}
    .text-center{text-align:center;}

    .neon-title{font-family:'Orbitron',sans-serif;background:linear-gradient(135deg,var(--c-accent),var(--c-primary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 12px rgba(255,107,0,.4));}

    /* Stepper */
    .stepper{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1.5rem;}
    .stepper-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700;}
    .stepper-num.active{background:linear-gradient(135deg,var(--c-primary),var(--c-accent));color:#0D0602;box-shadow:0 0 16px rgba(255,107,0,.6);}
    .stepper-num.idle{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);}
    .stepper-line{width:26px;height:1px;background:rgba(255,255,255,.18);}
    .stepper-label{font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);}

    /* Wheel */
    .roulette-wrapper{position:relative;width:100%;max-width:320px;margin:0 auto;}
    .roulette-container{position:relative;width:100%;padding-bottom:100%;}
    #wheel{position:absolute;top:0;left:0;width:100%;height:100%;}
    .wheel-segment{position:absolute;width:50%;height:50%;left:50%;top:0;transform-origin:0% 100%;overflow:hidden;}
    .wheel-segment-inner{position:absolute;width:200%;height:200%;left:-100%;top:0;display:flex;align-items:flex-start;justify-content:center;padding-top:20px;}
    .wheel-segment-inner span{font-family:'Orbitron',sans-serif;font-weight:900;font-size:.95rem;color:#181818;text-shadow:1px 1px 2px rgba(255,255,255,.5);}
    .wheel-glow{box-shadow:0 0 35px rgba(255,107,0,.55),0 0 70px rgba(255,215,0,.25),inset 0 0 22px rgba(0,0,0,.4);}
    .wheel-idle{animation:wheelIdle 2.6s ease-in-out infinite;}
    @keyframes wheelIdle{0%,100%{filter:drop-shadow(0 0 0 rgba(255,215,0,0));}50%{filter:drop-shadow(0 0 18px rgba(255,215,0,.35));}}

    /* Pointer */
    .pointer{position:absolute;top:0;left:50%;transform:translateX(-50%) translateY(-4px);z-index:50;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid #FFD700;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}

    /* Spin button */
    .spin-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#FF6B00,#FFD700);box-shadow:0 0 20px rgba(255,107,0,.6),0 0 40px rgba(255,215,0,.3);border:none;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:.7rem;color:#0D0602;transition:transform .2s,box-shadow .2s;letter-spacing:.05em;}
    .spin-center:hover{transform:translate(-50%,-50%) scale(1.1);}

    /* Try text */
    .try-text{font-family:'Orbitron',sans-serif;font-size:.8rem;color:rgba(255,255,255,.7);letter-spacing:.08em;margin-top:1.5rem;text-align:center;}

    /* Confetti */
    .confetti{position:fixed;z-index:9999;pointer-events:none;}

    /* Modal */
    .ff-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;visibility:hidden;transition:all .3s;padding:20px;backdrop-filter:blur(4px);}
    .ff-modal.active{opacity:1;visibility:visible;}
    .ff-modal-content{background:linear-gradient(180deg,rgba(13,6,2,.98),rgba(13,6,2,.99));border:1px solid rgba(255,107,0,.4);border-radius:18px;padding:30px;text-align:center;width:100%;max-width:400px;transform:scale(.9);transition:transform .3s;}
    .ff-modal.active .ff-modal-content{transform:scale(1);}
    .ff-btn-modal{background:linear-gradient(135deg,#FF6B00,#FF8C00);color:#fff;font-family:'Orbitron',sans-serif;font-weight:700;padding:.875rem 1.75rem;border-radius:999px;text-transform:uppercase;border:none;display:inline-flex;align-items:center;gap:.5rem;font-size:.875rem;box-shadow:0 4px 20px rgba(255,107,0,.4);transition:all .3s;}
    .ff-btn-modal:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(255,107,0,.6);}

    /* Prize card */
    .prize-card{background:linear-gradient(135deg,#FF6B00,#FF8C00);border-radius:16px;padding:20px 40px 25px;display:inline-block;margin-bottom:20px;box-shadow:0 8px 30px rgba(255,107,0,.5);animation:cardPop .4s ease-out .1s both;}
    @keyframes cardPop{from{opacity:0;transform:scale(.5) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
    .prize-label{display:block;font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:600;color:rgba(255,255,255,.75);letter-spacing:2px;margin-bottom:6px;}
    .prize-value{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;color:#fff;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.3);}
    .prize-title{font-family:'Orbitron',sans-serif;font-size:1.5rem;font-weight:900;background:linear-gradient(90deg,#FF6B00,#FFD700);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 8px;}
    .prize-sub{color:rgba(255,255,255,.7);font-size:.9rem;margin:0 0 20px;}
    .prize-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,#C2410C,#FF6B00);color:#fff;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.875rem;padding:14px 32px;border-radius:999px;text-decoration:none;box-shadow:0 4px 20px rgba(255,107,0,.5);transition:transform .2s,box-shadow .2s;}
    .prize-btn:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(255,215,0,.4);}
    .prize-reveal{display:none;}
    </style>

    <script>(function(){var p=new URLSearchParams(window.location.search);['utm_source','utm_medium','utm_campaign','utm_term','utm_content','src'].forEach(function(k){var v=p.get(k);if(v)sessionStorage.setItem(k,v);});})();</script>
</head>
<body>
<div class="ambient-bg" aria-hidden="true"></div>
<div class="page-content">
    <main style="padding:2rem 0 3rem;">
        <div class="ff-container">
            <!-- Stepper -->
            <div class="stepper">
                <span class="stepper-num idle">1</span><span class="stepper-label">Quiz</span>
                <span class="stepper-line"></span>
                <span class="stepper-num idle">2</span><span class="stepper-label">Quiz</span>
                <span class="stepper-line"></span>
                <span class="stepper-num active">3</span><span class="stepper-label">Roleta</span>
                <span class="stepper-line"></span>
                <span class="stepper-num idle">4</span><span class="stepper-label">Loja</span>
            </div>

            <h1 class="neon-title text-center" style="font-size:1.75rem;font-weight:700;margin-bottom:.5rem;">GIRE A ROLETA!</h1>
            <p class="text-center" style="color:rgba(255,255,255,.7);margin-bottom:2.5rem;font-size:.95rem;">Tente a sorte e ganhe descontos exclusivos na loja Free Fire.</p>

            <!-- Wheel -->
            <div class="roulette-wrapper">
                <div class="roulette-container">
                    <!-- Outer ring -->
                    <div style="position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(255,107,0,.35);background:conic-gradient(from 0deg,rgba(255,107,0,.15),rgba(255,215,0,.15),rgba(255,107,0,.15));"></div>
                    <!-- Inner glow ring -->
                    <div style="position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,215,0,.3);"></div>

                    <div id="wheelIdle" class="wheel-idle">
                        <div id="wheel" class="wheel-glow" style="border-radius:50%;overflow:hidden;"></div>
                    </div>
                    <!-- Pointer -->
                    <div class="pointer"></div>
                    <!-- Spin button -->
                    <button class="spin-center" id="spinBtn" onclick="spinWheel()">GIRAR</button>
                </div>
            </div>

            <p class="try-text" id="tryText">Você tem 2 tentativas.</p>
        </div>
    </main>
</div>

<!-- Lose Modal -->
<div class="ff-modal" id="loseModal">
    <div class="ff-modal-content">
        <div style="font-size:3rem;margin-bottom:1rem;">😢</div>
        <h2 style="font-family:'Orbitron',sans-serif;font-size:1.25rem;font-weight:700;color:#fff;margin-bottom:.5rem;">QUASE LÁ!</h2>
        <p style="color:rgba(255,255,255,.7);margin-bottom:1.5rem;">Você quase conseguiu! Tente novamente.</p>
        <button class="ff-btn-modal" onclick="closeLoseModal()"><i class="fas fa-redo"></i> GIRAR DE NOVO</button>
    </div>
</div>

<!-- Win Modal -->
<div class="ff-modal" id="prizeModal">
    <div class="ff-modal-content">
        <div id="prizeReveal" class="prize-reveal" style="display:block;">
            <div class="prize-card">
                <span class="prize-label">SEU DESCONTO</span>
                <p id="prizeName" class="prize-value"></p>
            </div>
            <h2 class="prize-title">PARABÉNS!</h2>
            <p class="prize-sub">Aproveite seu desconto exclusivo!</p>
            <a href="../loja.html" class="prize-btn"><i class="fas fa-cart-shopping"></i> RESGATAR PRÊMIO</a>
        </div>
    </div>
</div>

<script>
// Build wheel segments
var segments=[
    {label:'90%',color:'#FFD700',angle:45},
    {label:'10%',color:'#FF6B00',angle:45},
    {label:'50%',color:'#FFD700',angle:45},
    {label:'5%',color:'#FF8C00',angle:45},
    {label:'80%',color:'#FFD700',angle:45},
    {label:'0%',color:'#CC4400',angle:45},
    {label:'25%',color:'#FF6B00',angle:45},
    {label:'0%',color:'#CC4400',angle:45}
];

var wheelEl=document.getElementById('wheel');
var totalAngle=0;
segments.forEach(function(seg){
    var div=document.createElement('div');
    div.className='wheel-segment';
    div.style.transform='rotate('+totalAngle+'deg) skewY(-'+(90-seg.angle)+'deg)';
    div.style.background=seg.color;
    var inner=document.createElement('div');
    inner.className='wheel-segment-inner';
    inner.style.transform='skewY('+(90-seg.angle)+'deg) rotate('+(seg.angle/2)+'deg)';
    var span=document.createElement('span');
    span.textContent=seg.label;
    inner.appendChild(span);
    div.appendChild(inner);
    wheelEl.appendChild(div);
    totalAngle+=seg.angle;
});

var spinBtn=document.getElementById('spinBtn');
var loseModal=document.getElementById('loseModal');
var prizeModal=document.getElementById('prizeModal');
var tryText=document.getElementById('tryText');
var wheelIdle=document.getElementById('wheelIdle');
var isSpinning=false,currentRotation=0,spinsUsed=0;

function spinWheel(){
    if(isSpinning)return;
    isSpinning=true;
    spinBtn.style.pointerEvents='none';
    wheelIdle.classList.remove('wheel-idle');
    spinsUsed++;

    // Win on 2nd spin, lose on 1st
    var isWinner=(spinsUsed===2);
    // 67.5 = center of 90% segment, 337.5 = center of 0% segment
    var targetDegree=isWinner?67.5:337.5;
    var currentMod=currentRotation%360;
    var diff=targetDegree-currentMod;
    if(diff<0)diff+=360;
    currentRotation+=(360*3)+diff;

    wheelEl.style.transition='transform 6s cubic-bezier(0.17,0.67,0.12,0.99)';
    wheelEl.style.transform='rotate('+currentRotation+'deg)';

    setTimeout(function(){
        if(isWinner){
            document.getElementById('prizeName').textContent='Desconto de 90%';
            prizeModal.classList.add('active');
            createConfetti();
            sessionStorage.setItem('wonPrize',JSON.stringify({name:'Desconto de 90%',icon:'🎟️'}));
        } else {
            loseModal.classList.add('active');
        }
        isSpinning=false;
        spinBtn.style.pointerEvents='auto';
    },6200);
}

function closeLoseModal(){
    loseModal.classList.remove('active');
    var left=Math.max(0,2-spinsUsed);
    tryText.textContent=left===1?'Resta 1 tentativa.':(left===0?'Tentativas esgotadas.':'Você tem 2 tentativas.');
}

function createConfetti(){
    var colors=['#FF6B00','#FFD700','#FF8C00','#C2410C','#FFA500','#FFCC00'];
    for(var i=0;i<100;i++){
        (function(i){
            setTimeout(function(){
                var c=document.createElement('div');
                c.className='confetti';
                c.style.left=Math.random()*100+'vw';
                c.style.top='-10px';
                c.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
                c.style.borderRadius=Math.random()>.5?'50%':'0';
                c.style.width=Math.random()*10+5+'px';
                c.style.height=Math.random()*10+5+'px';
                document.body.appendChild(c);
                var anim=c.animate([
                    {transform:'translateY(0) rotate(0deg)',opacity:1},
                    {transform:'translateY(100vh) rotate('+Math.random()*720+'deg)',opacity:0}
                ],{duration:Math.random()*2000+2000,easing:'cubic-bezier(0.25,0.46,0.45,0.94)'});
                anim.onfinish=function(){c.remove();};
            },i*30);
        })(i);
    }
}
</script>
</body>
