<body style="background: #0D0602 !important;" class="utmify-roleta" id="page-roleta">

            <div style="display: flex; justify-content: center; margin-bottom: 0.75rem;">
                <svg viewBox="0 0 165 9" xmlns="http://www.w3.org/2000/svg" style="width: 8rem;">
                    <defs>

                    <path d="M141.16 0L133.04 8.12H128.45L136.57 0H141.16Z" fill="url(#titleGradRoleta)"></path>

                </svg>
            </div>
            <p style="color: #fff; font-size: 1rem; text-shadow: 0 1px 5px rgba(0,0,0,0.2);">Clique no 9 para girar e descobrir seu desconto!</p>
        </div>

        <!-- Roleta -->
        <div style="display: flex; justify-content: center; margin-bottom: 2.5rem;">
            <div class="roulette-wrapper">
                <!-- Ponteiro -->
                <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%) translateY(-4px); z-index: 30;">
                    <div style="width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #FFD700; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.9));"></div>
                </div>

                <!-- Container da Roleta -->
                <div class="roulette-container">
                    <!-- Borda externa decorativa -->
                    <div style="position: absolute; inset: -8px; border-radius: 50%; opacity: 0.7; background: conic-gradient(#FF6B00, #FFD700, #FFD700, #FFD700, #FF6B00);"></div>
                    <div style="position: absolute; inset: -4px; border-radius: 50%; background: #0D0D0D;"></div>

                    <!-- Roleta -->
                    <div id="wheel" style="border-radius: 50%; overflow: hidden; transition: transform 6s cubic-bezier(0.17, 0.67, 0.12, 0.99); transform: rotate(0deg);" class="wheel-glow">
                        <div class="wheel-segment" style="transform: rotate(0deg) skewY(-45deg);"><div class="wheel-segment-inner" style="background: #374151; transform: skewY(45deg) rotate(22.5deg);"><span>0%</span></div></div>
                        <div class="wheel-segment" style="transform: rotate(45deg) skewY(-45deg);"><div class="wheel-segment-inner" style="background: #005A4E; transform: skewY(45deg) rotate(22.5deg);"><span>10%</span></div></div>
                        <div class="wheel-segment" style="transform: rotate(90deg) skewY(-45deg);"><div class="wheel-segment-inner" style="background: #C2410C; transform: skewY(45deg) rotate(22.5deg);"><span>20%</span></div></div>
                        <div class="wheel-segment" style="transform: rotate(135deg) skewY(-45deg);"><div class="wheel-segment-inner" style="background: #FF6B00; transform: skewY(45deg) rotate(22.5deg);"><span>30%</span></div></div>
                        <div class="wheel-segment" style="transform: rotate(180deg) skewY(-45deg);"><div class="wheel-segment-inner" style="background: #FFD700; transform: skewY(45deg) rotate(22.5deg);"><span>50%</span></div></div>
                        <div class="wheel-segment" style="transform: rotate(225deg) skewY(-45deg);"><div class="wheel-segment-inner" style="background: #FF8C00; transform: skewY(45deg) rotate(22.5deg);"><span>70%</span></div></div>
                        <div class="wheel-segment" style="transform: rotate(270deg) skewY(-45deg);"><div class="wheel-segment-inner" style="background: #FF8C00; transform: skewY(45deg) rotate(22.5deg);"><span>90%</span></div></div>
                        <div class="wheel-segment" style="transform: rotate(315deg) skewY(-45deg);"><div class="wheel-segment-inner" style="background: #FFD700; transform: skewY(45deg) rotate(22.5deg);"><span>100%</span></div></div>

    <!-- Modal de Derrota (Primeiro Giro - 0%) -->
    <div id="loseModal" class="ff-modal">
        <div class="ff-modal-content">

    <!-- Modal de Prêmio (Segundo Giro - Ganhou!) -->
    <div id="prizeModal" class="ff-modal">

                <i class="fas fa-shopping-cart"></i> RESGATAR PRÊMIO
            </a>
        </div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const prizeModal = document.getElementById('prizeModal');
        const loseModal = document.getElementById('loseModal');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let spinInterval = null;

        function playTick() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function startSpinSound() {
            let delay = 80, count = 0;
            function tick() {
                playTick(); count++;
                if (count < 20) delay = 80;
                else if (count < 40) delay = 130;
                else if (count < 55) delay = 200;
                else delay = 320;
                if (count < 60) spinInterval = setTimeout(tick, delay);
            }
            tick();
        }

        function stopSpinSound() { if (spinInterval) { clearTimeout(spinInterval); spinInterval = null; } }

        function playGanhou() {
            const notas = [523.25, 659.25, 783.99, 1046.50];
            notas.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.4);
                osc.start(audioCtx.currentTime + i * 0.15);
                osc.stop(audioCtx.currentTime + i * 0.15 + 0.45);
            });
        }

        let isSpinning = false;
        let currentRotation = 0;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.style.pointerEvents = 'none';

            let attempts = parseInt(sessionStorage.getItem("spinAttempts") || "0");
            if (attempts >= 2) attempts = 0;
            attempts++;
            sessionStorage.setItem("spinAttempts", attempts.toString());

            let targetAngle, isWinner, prize;

            if (attempts === 1) {
                targetAngle = 337.5;
                isWinner = false;
            } else {
                targetAngle = 45;
                isWinner = true;
                prize = { name: "90% OFF!" };
            }

            let currentMod = currentRotation % 360;
            let diff = targetAngle - currentMod;
            if (diff <= 0) diff += 360;
            let angle = 360 * 5 + diff;

            currentRotation += angle;
            wheel.style.transition = "transform 6s cubic-bezier(0.17, 0.67, 0.12, 0.99)";
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            startSpinSound();

            setTimeout(() => {
                stopSpinSound();
                if (isWinner) showWinPrize(prize);
                else showLoseModal();
                isSpinning = false;
                spinBtn.style.pointerEvents = "auto";
            }, 6200);
        }

        function showLoseModal() { loseModal.classList.add('active'); }
        function closeLoseModal() { loseModal.classList.remove('active'); }

        function showWinPrize(prize) {
            document.getElementById('prizeName').textContent = prize.name;
            prizeModal.classList.add('active');
            playGanhou();
            createConfetti();
            sessionStorage.setItem('wonPrize', JSON.stringify(prize));
        }

        function createConfetti() {
            const colors = ['#FF6B00', '#FFD700', '#FFD700', '#C2410C', '#FF8C00', '#FF8C00'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    document.body.appendChild(confetti);
                    const animation = confetti.animate([
                        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                        { transform: `translateY(100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                    ], { duration: Math.random() * 2000 + 2000, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' });
                    animation.onfinish = () => confetti.remove();
                }, i * 30);
            }
        }
    </script>
