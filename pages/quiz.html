    <script>
        // Sons via Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playAcerto() {
            const notas = [523.25, 659.25, 783.99];
            notas.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.12);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime + i * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.25);
                osc.start(audioCtx.currentTime + i * 0.12);
                osc.stop(audioCtx.currentTime + i * 0.12 + 0.3);
            });
        }

        function playErro() {
            const notas = [300, 220];
            notas.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.18);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.18);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.18 + 0.3);
                osc.start(audioCtx.currentTime + i * 0.18);
                osc.stop(audioCtx.currentTime + i * 0.18 + 0.35);
            });
        }

        // Dados do quiz
        const questions = [
            {"question":"Quantos anos o Free Fire está completando neste aniversário?","options":["7 anos","8 anos","9 anos","10 anos"],"correct":2},
            {"question":"Qual empresa é responsável pelo Free Fire?","options":["Garena","Riot Games","Epic Games","Tencent"],"correct":0},
            {"question":"Qual é a moeda premium comprada com dinheiro real no Free Fire?","options":["Ouro","Gemas","Diamantes","Fichas"],"correct":2},
            {"question":"Como é chamada a área segura que diminui durante a partida?","options":["Círculo","Zona","Domo","Escudo"],"correct":0},
            {"question":"Quantos jogadores no máximo entram em uma partida clássica?","options":["40","60","100","50"],"correct":3},
            {"question":"Qual desses é um personagem clássico e popular do Free Fire?","options":["Alok","Kratos","Master Chief","Mario"],"correct":0},
            {"question":"Qual é o mapa mais clássico e conhecido do Free Fire?","options":["Kalahari","Purgatório","Bermuda","Alpes"],"correct":2},
            {"question":"O que os jogadores costumam comemorar a cada aniversário do FF?","options":["Fim do jogo","Novos servidores","Eventos e recompensas","Aumento de preços"],"correct":2}
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const quizContainer = document.getElementById('quizContainer');
        const resultContainer = document.getElementById('resultContainer');

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                showResults();
                return;
            }
            answered = false;
            const q = questions[currentQuestion];

            let optionsHTML = '';
            q.options.forEach((option, index) => {
                optionsHTML += `
                    <div class="ff-quiz-option" data-index="${index}" onclick="selectAnswer(${index})">
                        <div style="width: 2.5rem; height: 2.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 700; color: #000; flex-shrink: 0; background: linear-gradient(135deg, #FF6B00, #FFD700);">
                            ${String.fromCharCode(65 + index)}
                        </div>
                        <span style="color: #fff; font-size: 1.125rem; text-shadow: 0 1px 4px rgba(0,0,0,0.2);">${option}</span>
                    </div>
                `;
            });

            quizContainer.innerHTML = `
                <div class="animate-fade-in">
                    <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;">
                        <div class="ff-question-number">${currentQuestion + 1}</div>
                        <span style="color: rgba(255,255,255,0.8); font-family: 'Orbitron', sans-serif; font-size: 0.875rem; letter-spacing: 0.05em; text-shadow: 0 2px 8px rgba(0,0,0,0.2);">PERGUNTA ${currentQuestion + 1} DE ${questions.length}</span>
                    </div>
                    <h2 style="font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 2rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">${q.question}</h2>
                    <div id="options">${optionsHTML}</div>
                </div>
            `;
        }

        function selectAnswer(index) {
            if (answered) return;
            answered = true;

            const options = document.querySelectorAll('.ff-quiz-option');
            options[index].classList.add('selected');

            const isCorrect = index === questions[currentQuestion].correct;

            options.forEach((option, i) => {
                option.style.pointerEvents = 'none';
                if (i === index && !isCorrect) option.classList.add('incorrect');
                if (i === questions[currentQuestion].correct) option.classList.add('correct');
            });

            if (isCorrect) { score++; playAcerto(); showFeedback('success'); }
            else { playErro(); showFeedback('error'); }

            setTimeout(() => { currentQuestion++; loadQuestion(); }, 1500);
        }

        function showFeedback(type) {
            const isCorrect = type === 'success';
            const colorHex = isCorrect ? '#4ade80' : '#f87171';
            const iconText = isCorrect ? '✓ Correto!' : '✗ Incorreto!';

            const feedback = document.createElement('div');
            feedback.className = 'animate-fade-in';
            feedback.style.cssText = `text-align: center; font-size: 1.5rem; font-family: 'Orbitron', sans-serif; font-weight: 700; color: ${colorHex}; margin-top: 1rem;`;
            feedback.textContent = iconText;
            document.getElementById('options').appendChild(feedback);
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            document.getElementById('finalScore').textContent = score;

            let message = '';
            const percentage = (score / questions.length) * 100;
            if (percentage === 100) message = 'Incrível! Você é uma verdadeira lenda do Free Fire! 🎉🔥';
            else if (percentage >= 80) message = 'Excelente! Você manja muito do Free Fire! 🎂';
            else if (percentage >= 60) message = 'Muito bem! Você acompanha bem a história do Free Fire!';
            else if (percentage >= 40) message = 'Bom esforço! Continue comemorando os 9 anos do Free Fire!';
            else message = 'Você precisa conhecer melhor a história do Free Fire!';

            document.getElementById('resultMessage').textContent = message;
            sessionStorage.setItem('quizScore', score);
            sessionStorage.setItem('quizCompleted', 'true');
        }

        document.addEventListener('DOMContentLoaded', () => { loadQuestion(); });
    </script>
