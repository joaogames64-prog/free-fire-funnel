<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Autoriza o Árbitro! - Free Fire | Garena</title>
    <link rel="icon" type="image/png" href="../images/iconff.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root{--c-primary:#00B89C;--c-primary-dark:#007A68;--c-accent:#FF6B00;--c-gold:#FFD700;--c-bg:#020D0B;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{background:var(--c-bg)!important;font-family:'Poppins',sans-serif;color:#fff;min-height:100vh;}
    a{color:inherit;text-decoration:none;}img{max-width:100%;display:block;}button{cursor:pointer;font-family:inherit;}

    .ambient-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
    .ambient-bg::before,.ambient-bg::after{content:'';position:absolute;width:50vmax;height:50vmax;border-radius:50%;filter:blur(90px);opacity:.28;will-change:transform;}
    .ambient-bg::before{background:radial-gradient(circle,var(--c-primary),transparent 60%);top:-14vmax;left:-10vmax;animation:orbA 20s ease-in-out infinite;}
    .ambient-bg::after{background:radial-gradient(circle,var(--c-accent),transparent 60%);bottom:-16vmax;right:-12vmax;animation:orbB 24s ease-in-out infinite;}
    @keyframes orbA{0%,100%{transform:translate(0,0)}50%{transform:translate(5vmax,4vmax)}}
    @keyframes orbB{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vmax,-3vmax)}}

    .page-content{position:relative;z-index:1;}
    .ff-container{max-width:48rem;margin:0 auto;padding:0 16px;}

    .neon-title{font-family:'Orbitron',sans-serif;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 12px rgba(0,184,156,.4));}

    /* Stepper */
    .stepper{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1.5rem;}
    .stepper-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700;}
    .stepper-num.active{background:linear-gradient(135deg,var(--c-primary),var(--c-accent));color:#021;box-shadow:0 0 16px rgba(0,184,156,.6);}
    .stepper-num.idle{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);}
    .stepper-line{width:26px;height:1px;background:rgba(255,255,255,.18);}
    .stepper-label{font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);}

    /* Progress */
    .progress-wrap{margin-bottom:2rem;}
    .progress-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
    .progress-label{font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:.08em;color:rgba(255,255,255,.7);text-transform:uppercase;}
    .score-chip{display:inline-flex;align-items:center;gap:.45rem;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;padding:.4rem .9rem;border-radius:999px;color:#FFD700;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.35);}
    .progress-track{height:10px;width:100%;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(0,184,156,.2);}
    .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--c-primary),var(--c-accent),var(--c-gold));border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 14px rgba(0,184,156,.5);}

    /* Quiz card */
    .quiz-card{background:linear-gradient(145deg,rgba(3,22,18,.9),rgba(2,13,11,.95));backdrop-filter:blur(10px);border:1px solid rgba(0,184,156,.35);border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 0 30px rgba(0,184,156,.05);padding:1.5rem;}
    @media(min-width:640px){.quiz-card{padding:2rem;}}

    .q-number{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.25rem;color:#021;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));margin-bottom:1.5rem;}
    .q-text{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:2rem;text-shadow:0 2px 10px rgba(0,0,0,.3);line-height:1.4;}

    /* Options */
    .opt{background:rgba(3,22,18,.8);border:2px solid rgba(0,184,156,.28);border-radius:14px;padding:1rem;margin-bottom:.75rem;display:flex;align-items:center;gap:1rem;cursor:pointer;transition:all .25s;backdrop-filter:blur(5px);}
    .opt:hover{border-color:rgba(255,107,0,.8);background:rgba(0,60,48,.8);transform:translateX(8px);box-shadow:0 4px 22px rgba(0,184,156,.3);}
    .opt.correct{background:#15803d!important;border-color:#22c55e!important;box-shadow:0 0 24px rgba(34,197,94,.5)!important;}
    .opt.incorrect{background:#991b1b!important;border-color:#ef4444!important;box-shadow:0 0 24px rgba(239,68,68,.5)!important;}
    .opt.selected{background:rgba(0,184,156,.2);border-color:rgba(255,107,0,.8);transform:translateX(8px);}
    .opt-letter{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;color:#021;flex-shrink:0;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));transition:transform .2s;}
    .opt:hover .opt-letter{transform:scale(1.08);}
    .opt-text{color:#fff;font-size:1.125rem;text-shadow:0 1px 4px rgba(0,0,0,.2);}

    /* Result */
    .result-card{background:linear-gradient(145deg,rgba(3,22,18,.9),rgba(2,13,11,.95));border:1px solid rgba(0,184,156,.35);border-radius:18px;padding:2rem;text-align:center;display:none;}
    .result-card.show{display:block;animation:popIn .4s ease-out;}
    @keyframes popIn{from{opacity:0;transform:scale(.96) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
    .result-btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#FF6B00,#FF8C00);color:#fff;font-family:'Orbitron',sans-serif;font-weight:700;padding:1rem 2rem;border-radius:999px;text-transform:uppercase;border:none;display:inline-flex;align-items:center;gap:.75rem;box-shadow:0 4px 20px rgba(255,107,0,.4);transition:transform .25s,box-shadow .25s;}
    .result-btn::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite;}
    @keyframes shine{0%{left:-120%}55%,100%{left:160%}}
    .result-btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,184,156,.6);background:linear-gradient(135deg,#00B89C,#007A68);}
    .feedback{text-align:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.5rem;margin-top:1rem;animation:popIn .3s ease-out;}
    .feedback.green{color:#4ade80;}.feedback.red{color:#f87171;}
    .hidden{display:none!important;}
    </style>

    <!-- UTM Persist -->
    <script>(function(){var p=new URLSearchParams(window.location.search);['utm_source','utm_medium','utm_campaign','utm_term','utm_content','src'].forEach(function(k){var v=p.get(k);if(v)sessionStorage.setItem(k,v);});})();</script>
</head>
<body>
<div class="ambient-bg" aria-hidden="true"></div>
<div class="page-content">
    <main style="padding:2rem 0 3rem;">
        <div class="ff-container">
            <div class="stepper">
                <span class="stepper-num idle">1</span><span class="stepper-label">Quiz</span>
                <span class="stepper-line"></span>
                <span class="stepper-num active">2</span><span class="stepper-label">Quiz</span>
                <span class="stepper-line"></span>
                <span class="stepper-num idle">3</span><span class="stepper-label">Roleta</span>
                <span class="stepper-line"></span>
                <span class="stepper-num idle">4</span><span class="stepper-label">Loja</span>
            </div>
            <h1 class="neon-title" style="text-align:center;font-size:1.75rem;font-weight:700;margin-bottom:.5rem;">QUIZ DA COPA DO MUNDO</h1>
            <p style="text-align:center;color:rgba(255,255,255,.7);margin-bottom:2rem;font-size:.95rem;">Acerte as perguntas e avance para a roleta de descontos.</p>
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-row">
                    <span class="progress-label" id="progressText">PERGUNTA 1 DE 8</span>
                    <span class="score-chip"><i class="fas fa-star"></i> <span id="scoreChip">0</span>/8</span>
                </div>
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <div id="quizContainer" class="quiz-card"></div>
            <div id="resultContainer" class="result-card">
                <div style="margin-bottom:1.5rem;"><i class="fas fa-trophy" style="font-size:5rem;color:#FFD700;filter:drop-shadow(0 4px 12px rgba(255,215,0,.5));"></i></div>
                <h2 class="neon-title" style="font-size:1.875rem;font-weight:700;margin-bottom:1rem;">QUIZ COMPLETO!</h2>
                <p style="color:#fff;font-size:1.25rem;margin-bottom:.5rem;">Você acertou</p>
                <p style="font-family:'Orbitron',sans-serif;font-size:3rem;font-weight:900;color:#FFD700;text-shadow:0 2px 10px rgba(255,215,0,.5);margin-bottom:1.5rem;"><span id="finalScore">0</span>/8</p>
                <p id="resultMessage" style="color:#fff;margin-bottom:2rem;text-shadow:0 2px 8px rgba(0,0,0,.3);"></p>
                <a href="roleta.html" class="result-btn"><i class="fas fa-bullseye"></i> GIRAR A ROLETA
                    <svg width="15" height="11" viewBox="0 0 15 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.34241 10.96H0V0.0400391H1.71674L6.98958 5.31287L1.34241 10.96Z" fill="#fff"/><path d="M7.64783 0.0400391V1.58252L10.7715 4.71266L12.0881 3.39607L8.72563 0.0400391H7.64783Z" fill="#fff"/><path d="M7.64783 10.8117H8.95797L14.1985 5.57113L12.8819 4.26099L7.64783 9.4951V10.8117Z" fill="#fff"/></svg>
                </a>
            </div>
        </div>
    </main>
</div>
<script>
var questions=[
    {question:"Qual país venceu mais Copas do Mundo na história?",options:["Alemanha","Itália","Brasil","Argentina"],correct:2},
    {question:"Em qual país foi realizada a Copa do Mundo de 2022?",options:["Catar","Rússia","Brasil","França"],correct:0},
    {question:"Qual seleção foi campeã da Copa do Mundo de 2022?",options:["França","Brasil","Croácia","Argentina"],correct:3},
    {question:"Qual jogador se tornou o maior artilheiro de uma única Copa em 2022?",options:["Lionel Messi","Ronaldo Fenômeno","Kylian Mbappé","Gerd Müller"],correct:2},
    {question:"Quantas vezes o Brasil foi campeão mundial?",options:["4 vezes","6 vezes","3 vezes","5 vezes"],correct:3},
    {question:"Qual foi o artilheiro da Copa do Mundo de 2022?",options:["Lionel Messi","Richarlison","Neymar","Kylian Mbappé"],correct:3},
    {question:"Em que ano o Brasil ganhou sua primeira Copa do Mundo?",options:["1950","1962","1970","1958"],correct:3},
    {question:"Qual jogador é o único a vencer 3 Copas do Mundo?",options:["Ronaldo","Zidane","Messi","Pelé"],correct:3}
];
var cur=0,score=0,answered=false;
var qC=document.getElementById('quizContainer'),rC=document.getElementById('resultContainer');
var pF=document.getElementById('progressFill'),pT=document.getElementById('progressText');
var sC=document.getElementById('scoreChip'),pW=document.getElementById('progressWrap');
function updateProgress(){pF.style.width=(cur/questions.length*100)+'%';pT.textContent='PERGUNTA '+Math.min(cur+1,questions.length)+' DE '+questions.length;sC.textContent=score;}
function loadQuestion(){
    if(cur>=questions.length){showResults();return;}
    answered=false;var q=questions[cur];updateProgress();
    var h='<div style="animation:popIn .4s ease-out;"><div class="q-number">'+(cur+1)+'</div><h2 class="q-text">'+q.question+'</h2><div id="options">';
    q.options.forEach(function(o,i){h+='<div class="opt" onclick="selectAnswer('+i+')" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\')selectAnswer('+i+')"><div class="opt-letter">'+String.fromCharCode(65+i)+'</div><span class="opt-text">'+o+'</span></div>';});
    h+='</div></div>';qC.innerHTML=h;
}
function selectAnswer(idx){
    if(answered)return;answered=true;
    var opts=document.querySelectorAll('.opt'),q=questions[cur],ok=idx===q.correct;
    if(ok)score++;opts[idx].classList.add('selected');
    opts.forEach(function(o,i){o.style.pointerEvents='none';if(i===idx&&!ok)o.classList.add('incorrect');if(i===q.correct)o.classList.add('correct');});
    sC.textContent=score;
    var fb=document.createElement('div');fb.className='feedback '+(ok?'green':'red');fb.textContent=ok?'✓ Correto!':'✗ Incorreto!';
    document.getElementById('options').appendChild(fb);
    setTimeout(function(){cur++;loadQuestion();},1500);
}
function showResults(){
    pF.style.width='100%';pW.classList.add('hidden');qC.classList.add('hidden');rC.classList.add('show');
    document.getElementById('finalScore').textContent=score;
    var pct=score/questions.length*100,msg='';
    if(pct===100)msg='Incrível! O árbitro te autoriza! Você é um craque da Copa do Mundo! 🏆⚽';
    else if(pct>=80)msg='Excelente! Você está pronto para a Copa do Mundo 2026! ⚽';
    else if(pct>=60)msg='Muito bem! Continue estudando o futebol mundial!';
    else if(pct>=40)msg='Bom esforço! Estude mais sobre a história das Copas do Mundo!';
    else msg='Você precisa conhecer melhor a história da Copa do Mundo!';
    document.getElementById('resultMessage').textContent=msg;
    sessionStorage.setItem('quizScore',score);sessionStorage.setItem('quizCompleted','true');
}
document.addEventListener('DOMContentLoaded',loadQuestion);
</script>
</body>
</html>
