<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Free Fire × Naruto - Evento Exclusivo | Garena</title>
    <link rel="icon" type="image/png" href="../images/iconff.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root{--c-primary:#FF6B00;--c-accent:#7C3AED;--c-gold:#FFD700;--c-bg:#08050F;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{background:var(--c-bg)!important;font-family:'Poppins',sans-serif;color:#fff;min-height:100vh;}
    a{color:inherit;text-decoration:none;}img{max-width:100%;display:block;}button{cursor:pointer;font-family:inherit;}

    .ambient-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
    .ambient-bg::before,.ambient-bg::after{content:'';position:absolute;width:50vmax;height:50vmax;border-radius:50%;filter:blur(90px);opacity:.28;will-change:transform;}
    .ambient-bg::before{background:radial-gradient(circle,#FF6B00,transparent 60%);top:-14vmax;left:-10vmax;animation:orbA 20s ease-in-out infinite;}
    .ambient-bg::after{background:radial-gradient(circle,#7C3AED,transparent 60%);bottom:-16vmax;right:-12vmax;animation:orbB 24s ease-in-out infinite;}
    @keyframes orbA{0%,100%{transform:translate(0,0)}50%{transform:translate(5vmax,4vmax)}}
    @keyframes orbB{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vmax,-3vmax)}}

    .page-content{position:relative;z-index:1;}
    .ff-container{max-width:48rem;margin:0 auto;padding:0 16px;}

    .neon-title{font-family:'Orbitron',sans-serif;background:linear-gradient(135deg,#FF6B00,#FFD700);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 12px rgba(255,107,0,.4));}

    /* Stepper */
    .stepper{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1.5rem;}
    .stepper-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700;}
    .stepper-num.active{background:linear-gradient(135deg,#FF6B00,#7C3AED);color:#fff;box-shadow:0 0 16px rgba(255,107,0,.6);}
    .stepper-num.idle{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);}
    .stepper-line{width:26px;height:1px;background:rgba(255,255,255,.18);}
    .stepper-label{font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);}

    /* Progress */
    .progress-wrap{margin-bottom:2rem;}
    .progress-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
    .progress-label{font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:.08em;color:rgba(255,255,255,.7);text-transform:uppercase;}
    .score-chip{display:inline-flex;align-items:center;gap:.45rem;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;padding:.4rem .9rem;border-radius:999px;color:#FFD700;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.35);}
    .progress-track{height:12px;width:100%;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,107,0,.2);}
    .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#7C3AED,#FF6B00,#FFD700);border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 14px rgba(255,107,0,.5);}

    /* Quiz card */
    .quiz-card{background:linear-gradient(145deg,rgba(20,10,40,.9),rgba(8,5,15,.95));backdrop-filter:blur(10px);border:1px solid rgba(124,58,237,.35);border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 0 30px rgba(124,58,237,.05);padding:1.5rem;}
    @media(min-width:640px){.quiz-card{padding:2rem;}}

    .q-number{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.25rem;color:#fff;background:linear-gradient(135deg,#7C3AED,#FF6B00);margin-bottom:1.5rem;}
    .q-text{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:2rem;text-shadow:0 2px 10px rgba(0,0,0,.3);line-height:1.4;}

    /* Options */
    .opt{background:rgba(20,10,40,.8);border:2px solid rgba(124,58,237,.28);border-radius:14px;padding:1rem;margin-bottom:.75rem;display:flex;align-items:center;gap:1rem;cursor:pointer;transition:all .25s;backdrop-filter:blur(5px);user-select:none;}
    .opt:hover:not(.incorrect):not(.correct){border-color:rgba(255,107,0,.8);background:rgba(60,20,80,.8);transform:translateX(8px);box-shadow:0 4px 22px rgba(124,58,237,.3);}
    .opt.correct{background:#15803d!important;border-color:#22c55e!important;box-shadow:0 0 24px rgba(34,197,94,.5)!important;transform:translateX(8px);}
    .opt.incorrect{background:#991b1b!important;border-color:#ef4444!important;box-shadow:0 0 24px rgba(239,68,68,.5)!important;pointer-events:none!important;}
    .opt.disabled-opt{pointer-events:none;opacity:.6;}
    .opt-letter{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#7C3AED,#FF6B00);transition:transform .2s;}
    .opt:hover .opt-letter{transform:scale(1.08);}
    .opt-text{color:#fff;font-size:1.125rem;text-shadow:0 1px 4px rgba(0,0,0,.2);}

    /* Feedback messages */
    .feedback{text-align:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.2rem;margin-top:1rem;padding:.6rem 1rem;border-radius:12px;animation:popIn .3s ease-out;}
    .feedback.green{color:#4ade80;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);}
    .feedback.red{color:#f87171;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);}

    /* Result */
    .result-card{background:linear-gradient(145deg,rgba(20,10,40,.9),rgba(8,5,15,.95));border:1px solid rgba(124,58,237,.35);border-radius:18px;padding:2rem;text-align:center;display:none;}
    .result-card.show{display:block;animation:popIn .4s ease-out;}
    @keyframes popIn{from{opacity:0;transform:scale(.96) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
    .result-btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#FF6B00,#7C3AED);color:#fff;font-family:'Orbitron',sans-serif;font-weight:700;padding:1rem 2rem;border-radius:999px;text-transform:uppercase;border:none;display:inline-flex;align-items:center;gap:.75rem;box-shadow:0 4px 20px rgba(255,107,0,.4);transition:transform .25s,box-shadow .25s;}
    .result-btn::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite;}
    @keyframes shine{0%{left:-120%}55%,100%{left:160%}}
    .result-btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(124,58,237,.6);}
    .hidden{display:none!important;}
    </style>

    <script>(function(){var p=new URLSearchParams(window.location.search);['utm_source','utm_medium','utm_campaign','utm_term','utm_content','src'].forEach(function(k){var v=p.get(k);if(v)sessionStorage.setItem(k,v);});})();</script>
</head>
<body>
<div class="ambient-bg" aria-hidden="true"></div>
<div class="page-content">
    <main style="padding:2rem 0 3rem;">
        <div class="ff-container">
            <div class="stepper">
                <span class="stepper-num idle">1</span><span class="stepper-label">Quiz</span>
                <span class="stepper-line"></span>
                <span class="stepper-num active">2</span><span class="stepper-label">Quiz</span>
                <span class="stepper-line"></span>
                <span class="stepper-num idle">3</span><span class="stepper-label">Roleta</span>
                <span class="stepper-line"></span>
                <span class="stepper-num idle">4</span><span class="stepper-label">Loja</span>
            </div>
            <h1 class="neon-title" style="text-align:center;font-size:1.75rem;font-weight:700;margin-bottom:.5rem;">QUIZ FREE FIRE</h1>
            <p style="text-align:center;color:rgba(255,255,255,.7);margin-bottom:2rem;font-size:.95rem;">🍃 Acerte todas e avance para a roleta de descontos ninja!</p>
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-row">
                    <span class="progress-label" id="progressText">PERGUNTA 1 DE 8</span>
                    <span class="score-chip"><i class="fas fa-star"></i> <span id="scoreChip">0</span>/8</span>
                </div>
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <div id="quizContainer" class="quiz-card"></div>
            <div id="resultContainer" class="result-card">
                <div style="margin-bottom:1.5rem;font-size:5rem;">🍥</div>
                <h2 class="neon-title" style="font-size:1.875rem;font-weight:700;margin-bottom:1rem;">QUIZ COMPLETO!</h2>
                <p style="color:#fff;font-size:1.25rem;margin-bottom:.5rem;">Você acertou</p>
                <p style="font-family:'Orbitron',sans-serif;font-size:3rem;font-weight:900;color:#FFD700;text-shadow:0 2px 10px rgba(255,215,0,.5);margin-bottom:1.5rem;"><span id="finalScore">0</span>/8</p>
                <p id="resultMessage" style="color:#fff;margin-bottom:2rem;text-shadow:0 2px 8px rgba(0,0,0,.3);"></p>
                <a href="roleta.html" class="result-btn"><i class="fas fa-bullseye"></i> GIRAR A ROLETA
                    <svg width="15" height="11" viewBox="0 0 15 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.34241 10.96H0V0.0400391H1.71674L6.98958 5.31287L1.34241 10.96Z" fill="#fff"/><path d="M7.64783 0.0400391V1.58252L10.7715 4.71266L12.0881 3.39607L8.72563 0.0400391H7.64783Z" fill="#fff"/><path d="M7.64783 10.8117H8.95797L14.1985 5.57113L12.8819 4.26099L7.64783 9.4951V10.8117Z" fill="#fff"/></svg>
                </a>
            </div>
        </div>
    </main>
</div>
<script>
// ── Sound Effects via Web Audio API ──────────────────────────────────────────
var audioCtx = null;
function getCtx(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return audioCtx;}
function playCorrectSound(){
    var ctx=getCtx();if(!ctx)return;
    var t=ctx.currentTime;
    [[523,0],[659,.12],[784,.24],[1047,.4]].forEach(function(n){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';o.frequency.value=n[0];
        g.gain.setValueAtTime(0,t+n[1]);g.gain.linearRampToValueAtTime(.35,t+n[1]+.04);
        g.gain.linearRampToValueAtTime(0,t+n[1]+.18);
        o.start(t+n[1]);o.stop(t+n[1]+.22);
    });
}
function playWrongSound(){
    var ctx=getCtx();if(!ctx)return;
    var t=ctx.currentTime;
    [[300,0,0.35],[220,.2,0.35],[180,.38,0.3]].forEach(function(n){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sawtooth';o.frequency.value=n[0];
        g.gain.setValueAtTime(0,t+n[1]);g.gain.linearRampToValueAtTime(n[2],t+n[1]+.04);
        g.gain.linearRampToValueAtTime(0,t+n[1]+.18);
        o.start(t+n[1]);o.stop(t+n[1]+.2);
    });
}

// ── Quiz Data ─────────────────────────────────────────────────────────────────
var questions=[
    {question:"Qual é o mapa mais famoso do Free Fire?",options:["Bermuda","Miramar","Purgatório","Erangel"],correct:0},
    {question:"Qual é a moeda principal usada no Free Fire?",options:["Ouro","Cristal","Diamante","Token"],correct:2},
    {question:"Qual destas armas é uma submetralhadora popular no Free Fire?",options:["MP40","AWM","M1014","M60"],correct:0},
    {question:"Qual personagem do Free Fire possui a habilidade 'Drop the Beat'?",options:["DJ Alok","Chrono","Kelly","Hayato"],correct:0},
    {question:"Qual é o nome do modo mais jogado do Free Fire?",options:["Contra Squad","Battle Royale","Corrida Mortal","Treino"],correct:1},
    {question:"Qual destas armas é do tipo 'sniper' no Free Fire?",options:["AWM","UMP","M500","Thompson"],correct:0},
    {question:"Qual é a raridade da skin 'Hip Hop' no Free Fire?",options:["Comum","Rara","Épica","Lendária"],correct:3},
    {question:"Qual personagem é conhecido por aumentar a velocidade de corrida?",options:["Kelly","Maxim","Moco","Laura"],correct:0}
];

var cur=0,score=0;
var triedWrong=[];
var qC=document.getElementById('quizContainer'),rC=document.getElementById('resultContainer');
var pF=document.getElementById('progressFill'),pT=document.getElementById('progressText');
var sC=document.getElementById('scoreChip'),pW=document.getElementById('progressWrap');

function updateProgress(){
    pF.style.width=(cur/questions.length*100)+'%';
    pT.textContent='PERGUNTA '+Math.min(cur+1,questions.length)+' DE '+questions.length;
    sC.textContent=score;
}

function loadQuestion(){
    if(cur>=questions.length){showResults();return;}
    triedWrong=[];
    var q=questions[cur];updateProgress();
    var h='<div style="animation:popIn .4s ease-out;"><div class="q-number">'+(cur+1)+'</div><h2 class="q-text">'+q.question+'</h2><div id="options">';
    q.options.forEach(function(o,i){
        h+='<div class="opt" id="opt-'+i+'" onclick="selectAnswer('+i+')" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\')selectAnswer('+i+')"><div class="opt-letter">'+String.fromCharCode(65+i)+'</div><span class="opt-text">'+o+'</span></div>';
    });
    h+='</div><div id="feedbackArea"></div></div>';
    qC.innerHTML=h;
}

function selectAnswer(idx){
    // If already tried this wrong option, ignore
    if(triedWrong.indexOf(idx)!==-1)return;
    var q=questions[cur];
    var opts=document.querySelectorAll('.opt');
    var fb=document.getElementById('feedbackArea');

    if(idx===q.correct){
        // CORRECT
        opts[idx].classList.add('correct');
        // Disable all other options
        opts.forEach(function(o,i){if(i!==idx)o.classList.add('disabled-opt');});
        score++;sC.textContent=score;
        if(fb){fb.innerHTML='<div class="feedback green">✓ Correto! Bem jogado, ninja! 🍃</div>';}
        playCorrectSound();
        setTimeout(function(){cur++;loadQuestion();},1200);
    } else {
        // WRONG – mark this option red, play error, allow retry
        triedWrong.push(idx);
        opts[idx].classList.add('incorrect');
        if(fb){fb.innerHTML='<div class="feedback red">✗ Errado! Tente novamente...</div>';}
        playWrongSound();
        // Shake the card
        qC.animate({transform:['translateX(0)','translateX(-8px)','translateX(8px)','translateX(-5px)','translateX(0)']},{duration:320,easing:'ease-out'});
        setTimeout(function(){if(fb){fb.innerHTML='';}},1200);
    }
}

function showResults(){
    pF.style.width='100%';pW.classList.add('hidden');qC.classList.add('hidden');rC.classList.add('show');
    document.getElementById('finalScore').textContent=score;
    var msg='';
    if(score===8)msg='Incrível! Você é um ninja mestre do Free Fire! Vá resgatar seu prêmio! 🏆🍥';
    else if(score>=6)msg='Excelente, jovem ninja! Você conhece muito bem o Free Fire! ⚡';
    else if(score>=4)msg='Bom treino! Continue aprimorando suas técnicas ninja! 🍃';
    else msg='Todo grande ninja começa pequeno! Continue treinando! 🌀';
    document.getElementById('resultMessage').textContent=msg;
    sessionStorage.setItem('quizScore',score);sessionStorage.setItem('quizCompleted','true');
}

document.addEventListener('DOMContentLoaded',loadQuestion);
</script>
</body>
</html>
