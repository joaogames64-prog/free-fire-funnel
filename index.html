    <script>
        // Modal VSL
        const vslModal = document.getElementById('vslModal');
        const closeVslModal = document.getElementById('closeVslModal');
        const vslVideo = document.getElementById('vslVideo');
        const playOverlay = document.getElementById('playOverlay');

        playOverlay.addEventListener('click', function() {
            playOverlay.style.opacity = '0';
            setTimeout(() => { playOverlay.style.display = 'none'; }, 300);
            vslVideo.play();
        });

        vslVideo.addEventListener('ended', function() {
            vslModal.style.display = 'none';
            vslVideo.pause();
        });

        closeVslModal.addEventListener('click', function() {
            vslModal.style.display = 'none';
            vslVideo.pause();
        });

        vslModal.addEventListener('click', function(e) {
            if (e.target === vslModal) {
                vslModal.style.display = 'none';
                vslVideo.pause();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && vslModal.style.display !== 'none') {
                vslModal.style.display = 'none';
                vslVideo.pause();
            }
        });
    </script>
